title: PHP Spawns Suspicious Child Process - Linux
id: eab25a01-54fc-4d4b-8280-a837937b98cd
related:
    - id: d5236104-89fc-4e0c-b5c4-f887cb4eda0d
      type: similar
status: experimental
description: |
    Detects when a PHP worker spawns a suspicious child process.
    It is unusual for a PHP worker to spawn a child process, which may indicate malicious activity or exploitation of vulnerabilities.
    It is associated with vulnerabilities such as CVE-2026-109618 and CVE-2026-109619, which can be exploited to execute arbitrary code.
references:
    - https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
    - https://github.com/php/php-src/security/advisories/GHSA-6wmf-4rv5-p3rp
    - https://www.wiz.io/blog/php2shell-php-rce
author: Bartosz Garba
date: 2026-10-22
tags:
    - attack.initial-access
    - attack.t1190
    - attack.execution
    - attack.t1059.004
    - attack.persistence
    - attack.t1505.003
    - cve.2026-109618
    - cve.2026-109619
logsource:
    category: process_creation
    product: linux
detection:
    selection_parent:
        - ParentImage|contains:
              - '/php-fpm'
              - '/php-cgi'
        - ParentImage|endswith:
              - '/apache2'
              - '/httpd'
    selection_child:
        Image|endswith:
            - '/sh'
            - '/bash'
            - '/dash'
            - '/whoami'
            - '/id'
            - '/uname'
            - '/hostname'
            - '/curl'
            - '/wget'
            - '/nc'
            - '/ncat'
            - '/python3'
            - '/perl'
    filter_main_sendmail:
        Image|endswith:
            - '/sh'
            - '/dash'
            - '/bash'
        CommandLine|contains: '/usr/sbin/sendmail'
    condition: all of selection_* and not 1 of filter_main_*
falsepositives:
    - Web applications that legitimately execute system commands via exec(), shell_exec(), system() or proc_open() (e.g. admin panels, backup or monitoring plugins)
    - CGI scripts executed by Apache that invoke a shell
level: high